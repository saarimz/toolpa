app = "ai-daw-tools-poc"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  TOOLPA_JS_VOLUME_ROOT = "/data"
  TOOLPA_JS_BUILDER_MODE = "scaffold"
  WORKSPACE_ROOT = "/data/ai-daw-tools"
  NEXT_TELEMETRY_DISABLED = "1"
  PORT = "3000"

[[mounts]]
  source = "ai_daw_tools_data"
  destination = "/data"
  initial_size = "20gb"
  snapshot_retention = 3
  processes = ["app"]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
